<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UML 2.5: Los 14 Diagramas Esenciales</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="presentation-container">
        <!-- Navigation Header -->
        <div class="presentation-header">
            <div class="slide-counter">
                <span id="current-slide">1</span> / <span id="total-slides">23</span>
            </div>
            <div class="navigation-buttons">
                <button class="btn btn--secondary btn--sm" id="prev-btn" disabled>
                    ← Anterior
                </button>
                <button class="btn btn--secondary btn--sm" id="next-btn">
                    Siguiente →
                </button>
            </div>
        </div>

        <!-- Slides Container -->
        <div class="slides-container" id="slides-container">
            <!-- Slides will be dynamically generated by JavaScript -->
        </div>

        <!-- Progress Bar -->
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>

        <!-- Keyboard shortcuts info -->
        <div class="shortcuts-info">
            <small>Navega con ←/→ o Espacio | Inicio/Fin para primera/última diapositiva</small>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
